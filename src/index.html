<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark light">
<meta name="format-detection" content="telephone=no">
<title>Rent·Control</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--TELEGRAM-->
<!--CSS-->
<style>
  html:not([data-theme]),html:not([data-theme]) body{background:#0b0b0c;margin:0}
  #boot{position:fixed;inset:0;display:grid;place-items:center}
  #boot i{width:44px;height:44px;border-radius:14px;background:#ffd60a;display:block;animation:bp 1.1s ease-in-out infinite}
  @keyframes bp{0%,100%{transform:scale(.86);opacity:.55}50%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="root"><div id="boot"><i></i></div></div>
<!--JS-->
</body>
</html>
